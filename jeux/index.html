<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Les jeux · EuroLeague France</title>
<meta name="description" content="Collectionne les cartes des joueurs d'EuroLeague : Plus ou moins, la grille du jour, titulaire-banc-vendu, le bon maillot, prono MVP… Les jeux EuroLeague France, avec classements.">
<meta property="og:title" content="Les jeux EuroLeague France">
<meta property="og:description" content="Collectionne les cartes des joueurs, joue à Plus ou moins, à la grille du jour, au prono MVP… et partage ton score.">
<meta property="og:image" content="https://note-des-joueurs.pages.dev/og/partage-accueil.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800;900&display=swap">
<style>
:root{--blue:#002496;--navy:#000C33;--red:#ED2839;--ink:#151E22;--muted:#5B666B;--line:#E3E6EE;--tint:#E6E9F4;--soft:#F3F5FA;--gold:#C8A24A;--ok:#1F8A3B;--okbg:#E7F5EA;--mid:#B7791F;--midbg:#FDF3DC;--ko:#D21F33;--kobg:#FDECEE}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:"Libre Franklin",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
a{color:var(--blue)}
button,input,select{font-family:inherit;color:inherit}
.wrap{max-width:1140px;margin:0 auto;padding:20px 16px 56px}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;margin-bottom:16px}
.hero h1{margin:0;font-size:40px;line-height:1.05;font-weight:900;letter-spacing:-.5px}
.hero h1 span{color:var(--red)}
.idbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.idbar b{color:var(--ink)}
.idbar form{display:flex;gap:6px}
.idbar input{height:36px;border:1.5px solid #A9B6CC;border-radius:18px;padding:0 12px;font-size:14px;width:170px}
.link{background:none;border:none;color:var(--blue);font-weight:700;cursor:pointer;padding:6px 2px;font-size:14px;text-decoration:underline}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin:0 -2px 8px;scrollbar-width:thin}
.tab{flex:none;height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab:hover{border-color:#B9C1D3}
.tab[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.tab .dot{width:7px;height:7px;border-radius:4px;background:var(--red)}
.card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:20px;min-width:0}
h2{margin:0 0 4px;font-size:26px;font-weight:900;line-height:1.15}
h3{margin:0 0 8px;font-size:18px;font-weight:800}
.lead{margin:0 0 16px;color:var(--muted);font-size:15px}
.kick{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--red)}
.btn{height:46px;padding:0 22px;border-radius:23px;border:none;background:var(--blue);color:#fff;font-weight:800;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.red{background:var(--red)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid #C7CDD8}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{flex:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.av{--s:56px;width:var(--s);height:var(--s);border-radius:50%;padding:1.5px;background:var(--gold);flex:none;display:inline-block}
.av .in{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--tint)}
.av img,.av i{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:var(--tint)}
.av i{display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:var(--blue);font-size:calc(var(--s) * .32)}
.logo{width:24px;height:24px;object-fit:contain;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:14px;background:var(--soft);font-size:13px;font-weight:700}
.score{font-size:13px;font-weight:800;color:var(--blue)}
.msg{font-weight:700;min-height:22px;margin:0}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:900px){.lay{grid-template-columns:minmax(0,1fr)}}
/* classement */
.board h3{display:flex;align-items:center;gap:8px}
.board ol{list-style:none;margin:8px 0 0;padding:0}
.board li{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid var(--line);font-size:14px}
.board li.me{background:#FFF1F2;border-radius:8px}
.board .r{width:24px;text-align:center;font-weight:900;color:var(--blue)}
.board li:nth-child(-n+3) .r{color:var(--red)}
.board .p{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .s{font-weight:900}
.board .s small{font-weight:600;color:var(--muted);font-size:12px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:18px;padding:2px;gap:2px}
.seg button{border:none;background:none;border-radius:15px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
/* joueur mystère */
.myst-top{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.myst-ph{--s:132px}
.myst-ph img,.big-ph img{transition:filter .5s}
.guess{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.guess input{flex:1 1 240px;min-width:0;height:48px;border:1.5px solid #A9B6CC;border-radius:24px;padding:0 18px;font-size:16px}
.guess input:focus,.idbar input:focus{outline:2px solid var(--blue);outline-offset:1px}
.tbl{overflow-x:auto;border:1.5px solid var(--line);border-radius:14px}
.tbl table{width:100%;border-collapse:collapse;min-width:640px;font-size:14px}
.tbl th{background:var(--soft);text-align:center;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:9px 6px;font-weight:700}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:14px}
.tbl td{border-top:1px solid var(--line);padding:6px;text-align:center;vertical-align:middle}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;border-radius:10px;padding:4px 6px;font-weight:700}
.c-ok{background:var(--okbg);color:var(--ok)}.c-mid{background:var(--midbg);color:var(--mid)}.c-ko{background:var(--soft);color:var(--ink)}
.cell small{font-size:11px;font-weight:700}
.who{display:flex;align-items:center;gap:10px;font-weight:700}
.who .av{--s:36px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend b{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.stat{display:flex;flex-direction:column;align-items:center;min-width:64px}
.stat b{font-size:26px;font-weight:900;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
/* listes de joueurs */
.matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.mhead{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:10px;font-size:15px}
.plist{display:flex;flex-direction:column;gap:6px}
.pbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:5px 10px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;text-align:left}
.pbtn .av{--s:38px}
.pbtn .nm{flex:1;min-width:0;font-weight:700;font-size:14px}
.pbtn .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.pbtn[aria-pressed=true]{border-color:var(--red);background:#FFF1F2}
.pbtn:disabled{opacity:.4;cursor:default}
div.pbtn{cursor:default}
.note{min-width:42px;text-align:center;font-weight:900;font-size:18px;padding:2px 6px;border-radius:8px}
.five-bar{position:sticky;top:0;z-index:2;background:#fff;padding:10px 0;border-bottom:1.5px solid var(--line);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.slots{display:flex;gap:8px}
.slot{--s:46px}
.slot.empty{width:46px;height:46px;border-radius:50%;border:2px dashed #C7CDD8}
/* qcm */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:15px;cursor:pointer;padding:6px 10px;display:flex;align-items:center;justify-content:center;gap:10px}
.opt:hover:not(:disabled){border-color:#9AA6BF}
.opt.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opt.ko{border-color:var(--ko);background:var(--kobg);color:var(--ko)}
.opt:disabled{cursor:default}
.opt img{width:34px;height:34px;object-fit:contain}
.big-ph{--s:170px}
.duel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;position:relative}
.duel .vs{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:24px;background:var(--ink);color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;pointer-events:none;box-shadow:0 0 0 5px #fff}
.pcard{border:2px solid var(--line);border-radius:18px;background:#fff;padding:22px 10px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;text-align:center;transition:transform .12s,border-color .12s}
.pcard:hover:not(:disabled){transform:translateY(-2px);border-color:#9AA6BF}
.pcard .av{--s:110px}
.pcard .v{font-weight:900;font-size:40px;line-height:1}
.pcard.ok{border-color:var(--ok);background:var(--okbg)}.pcard.ko{border-color:var(--ko);background:var(--kobg)}
.pcard:disabled{cursor:default}
.streak{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:14px}
.streak .n{font-size:56px;font-weight:900;line-height:1;color:var(--red)}
.streak .l{font-size:13px;font-weight:700;color:var(--muted);line-height:1.2;text-align:left}
/* classement à l'aveugle */
.avgame{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:640px){.avgame{grid-template-columns:minmax(0,1fr)}}
.avcard{background:linear-gradient(160deg,var(--blue),var(--navy));color:#fff;border-radius:16px;padding:18px 14px;text-align:center;border-bottom:5px solid var(--red)}
.avcard .av{--s:120px;margin:10px auto}
.avcard h3{color:#fff;font-size:22px;margin:4px 0 2px}
.avcard .s{color:rgba(255,255,255,.82);font-size:14px}
.avcard .k{font-size:12px;font-weight:800;letter-spacing:1.4px;color:#FF8A95;text-transform:uppercase}
.avcard .big{font-size:60px;font-weight:900;line-height:1;margin:8px 0 2px}
.avcard .big small{font-size:22px;color:rgba(255,255,255,.6)}
.avslots{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.avslot{display:flex;align-items:center;gap:10px;min-height:54px;padding:5px 10px;border-radius:12px;background:#fff;border:1.5px solid var(--line);width:100%;text-align:left}
button.avslot{border:2px dashed #C7CDD8;cursor:pointer;color:var(--muted);font-weight:700}
button.avslot:hover{border-color:var(--blue);color:var(--blue)}
.avslot .rk{flex:none;width:30px;text-align:center;font-weight:900;font-size:22px;color:var(--blue)}
.avslot .av{--s:38px}
.avslot .nm{flex:1;min-width:0;font-weight:700;font-size:14px}
.avslot .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.tag{font-size:12px;font-weight:800;padding:3px 8px;border-radius:10px;white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.mid{background:var(--midbg);color:var(--mid)}.tag.ko{background:var(--soft);color:var(--ink)}
@media (max-width:520px){.opts{grid-template-columns:minmax(0,1fr)}.pcard .av{--s:80px}.pcard .v{font-size:32px}.big-ph{--s:140px}.hero h1{font-size:32px}.tbl table{min-width:580px;font-size:13px}.who .av{--s:30px}}
/* partage */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,14,30,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.modal .box{background:#fff;border-radius:18px;max-width:440px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.modal img{width:100%;border-radius:12px;display:block;background:var(--soft);aspect-ratio:1080/1350}
.modal .row .btn{flex:1 1 140px}
/* ---------- collection ---------- */
.tab.gold{border-color:#D9B65C;background:linear-gradient(135deg,#FFF6DA,#F4E1A6);color:#5A4210}
.tab.gold[aria-selected=true]{background:linear-gradient(135deg,#E9C46A,#B8862B);border-color:#B8862B;color:#fff}
.colpill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;border:none;cursor:pointer;font-weight:800;font-size:14px;background:linear-gradient(135deg,#F7E3A3,#D9B25A);color:#3F2E08}
.colhead{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between;background:radial-gradient(120% 140% at 20% 0%,#11308F 0%,#061553 55%,#020a2c 100%);color:#fff;border-radius:20px;padding:24px;margin-bottom:16px;position:relative;overflow:hidden}
.colhead:after{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;border:40px solid rgba(232,196,106,.12)}
.colhead h2{color:#fff;margin:0}
.colhead .big{font-size:52px;font-weight:900;line-height:1}
.colhead .big small{font-size:22px;color:rgba(255,255,255,.65);font-weight:700}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden;min-width:220px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#F3D27B,#C8A24A);border-radius:5px}
.btn.goldb{background:linear-gradient(135deg,#F3D27B,#C8A24A);color:#2B1F05}
.sets{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;scrollbar-width:thin}
.set{flex:none;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:21px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.set[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}
.set img{width:22px;height:22px;object-fit:contain}
.set .c{font-weight:600;opacity:.7}
.set.done{border-color:#C8A24A}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.cardbtn{border:none;background:none;padding:0;cursor:pointer;display:block;width:100%;border-radius:12px;transition:transform .15s}
.cardbtn:hover{transform:translateY(-3px)}
.cardbtn canvas{width:100%;aspect-ratio:600/840;display:block}
.cardbtn:disabled{cursor:default}.cardbtn:disabled:hover{transform:none}
/* nouvelle carte */
.newcard{position:fixed;left:16px;bottom:16px;z-index:25;display:flex;align-items:center;gap:12px;background:#0B1A55;color:#fff;border-radius:16px;padding:10px 16px 10px 10px;box-shadow:0 12px 30px rgba(0,0,0,.35);transform:translateY(140%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);cursor:pointer;max-width:calc(100vw - 32px);border:1.5px solid rgba(232,196,106,.6)}
.newcard.on{transform:none}
.newcard canvas{width:64px;aspect-ratio:600/840;flex:none}
.newcard b{display:block;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:#F3D27B}
.newcard span{font-weight:800;font-size:15px}
/* pack */
.pack{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;perspective:1200px;margin:6px 0}
.flip{width:min(30vw,200px);aspect-ratio:600/840;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.3,.5,1);cursor:pointer;border:none;background:none;padding:0}
.flip.on{transform:rotateY(180deg)}
.flip canvas{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip canvas.front{transform:rotateY(180deg)}
.modal .box.wide{max-width:720px}
/* titulaire · banc · vendu */
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:640px){.trio{grid-template-columns:minmax(0,1fr)}.trio .tcol{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center}}
.tcol canvas{width:100%;aspect-ratio:600/840;display:block}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.role{height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:13px;cursor:pointer}
.role.t[aria-pressed=true]{background:#1F8A3B;border-color:#1F8A3B;color:#fff}
.role.r[aria-pressed=true]{background:#002496;border-color:#002496;color:#fff}
.role.v[aria-pressed=true]{background:#D21F33;border-color:#D21F33;color:#fff}
.role:disabled{cursor:default}
.res{margin-top:8px;display:grid;gap:4px;font-size:12px;font-weight:700}
.res div{display:grid;grid-template-columns:70px 1fr 38px;gap:6px;align-items:center}
.res i{display:block;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.res i b{display:block;height:100%;border-radius:4px}
/* grille */
.grid3{display:grid;grid-template-columns:minmax(70px,.8fr) repeat(3,minmax(0,1fr));gap:8px;max-width:640px}
.ghd{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:13px;line-height:1.2;padding:6px;border-radius:12px;background:var(--soft);min-height:56px}
.ghd img{width:44px;height:44px;object-fit:contain}
.ghd.row{flex-direction:column;gap:4px;font-size:11px}
.gcell{aspect-ratio:1;border-radius:14px;border:2px dashed #C7CDD8;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;font-weight:700;font-size:12px;text-align:center;color:var(--muted)}
.gcell:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.gcell.ok{border:2px solid #1F8A3B;background:var(--okbg);color:var(--ink)}
.gcell.ok .av{--s:min(64px,13vw)}
.gcell.sel{border-color:var(--red);border-style:solid;background:#FFF1F2}
.gcell small{font-weight:600;font-size:11px;color:var(--muted)}
.gcell:disabled{cursor:default}
/* l'intrus */
.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.icard{border:2px solid var(--line);border-radius:16px;background:#fff;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center}
.icard .av{--s:86px}
.icard:hover:not(:disabled){border-color:#9AA6BF;transform:translateY(-2px)}
.icard.ok{border-color:var(--ok);background:var(--okbg)}.icard.ko{border-color:var(--ko);background:var(--kobg)}
.icard:disabled{cursor:default}
.icard .facts{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center;align-items:center}
.icard .facts img{width:18px;height:18px;object-fit:contain}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-weight:700;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Les jeux <span>EuroLeague France</span></h1>
    <div class="idbar" id="idbar"></div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <main id="app" aria-live="polite"><p class="muted">Chargement…</p></main>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mt"><div class="box">
  <div class="row between"><h3 id="mt" style="margin:0">Partage ton score</h3><button class="link" id="mx" type="button">Fermer</button></div>
  <img id="mimg" alt="Image de ton score à partager">
  <div class="row" id="mbtns"></div>
</div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(async function(){
"use strict";
const $=s=>document.querySelector(s);

const IMG={};
const loadImg=src=>IMG[src]||(IMG[src]=new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src}));
function wrapText(x,t,maxW){const w=t.split(" "),l=[];let c="";for(const s of w){const n=c?c+" "+s:s;if(x.measureText(n).width>maxW&&c){l.push(c);c=s}else c=n}if(c)l.push(c);return l}
async function avatarC(x,p,cx,cy,r){
  x.save();x.beginPath();x.arc(cx,cy,r,0,7);x.fillStyle="#C8A24A";x.fill();
  x.beginPath();x.arc(cx,cy,r-4,0,7);x.fillStyle="#E6E9F4";x.fill();x.clip();
  const im=photoUrl(p)?await loadImg(photoUrl(p)):null;
  if(im)x.drawImage(im,cx-r+4,cy-r+4,2*r-8,2*r-8);else{x.fillStyle="#002496";x.font=`800 ${r*.6}px "Libre Franklin"`;x.textAlign="center";x.textBaseline="middle";x.fillText(ini(p),cx,cy)}
  x.restore();
}
function rrect(x,X,Y,W,H,R){x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath()}
async function makeCard(sp){
  await Promise.all(["900 80px","800 40px","700 30px","600 30px"].map(f=>document.fonts.load(f+' "Libre Franklin"').catch(()=>{})));
  const W=1080,H=1350,cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");
  const F=(w,s)=>`${w} ${s}px "Libre Franklin", Arial, sans-serif`;
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,"#0A2CA8");g.addColorStop(.55,"#00186E");g.addColorStop(1,"#000A2E");x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle="rgba(255,255,255,.06)";x.lineWidth=70;x.beginPath();x.arc(W-60,170,300,0,7);x.stroke();
  x.lineWidth=2;x.strokeStyle="rgba(200,162,74,.35)";x.beginPath();x.arc(W-60,170,370,0,7);x.stroke();
  const lg=await loadImg("../logo_white.png");if(lg){const h=86;x.drawImage(lg,64,60,lg.width*h/lg.height,h)}
  x.textBaseline="alphabetic";x.textAlign="left";
  x.fillStyle="#E2BE6A";x.font=F(800,30);x.fillText(sp.kicker.toUpperCase().split("").join(String.fromCharCode(8202)),64,250,W-128);
  x.fillStyle="#fff";x.font=F(900,74);let y=330;for(const l of wrapText(x,sp.title,W-128).slice(0,2)){x.fillText(l,64,y);y+=82}
  let top=y+10;const bottom=1150;
  if(sp.big!=null){
    x.font=F(900,250);const t=String(sp.big);const tw=x.measureText(t).width;x.fillStyle="#FF4A5C";x.fillText(t,64,top+210);
    if(sp.bigOver){x.font=F(800,70);x.fillStyle="rgba(255,255,255,.55)";x.fillText(sp.bigOver,64+tw+14,top+210)}
    if(sp.bigLabel){x.font=F(700,38);x.fillStyle="#fff";const lines=wrapText(x,sp.bigLabel,W-128);let yy=top+275;for(const l of lines.slice(0,2)){x.fillText(l,64,yy);yy+=48}top=yy+10}else top+=260;
  }
  if(sp.grid){ // carrés du joueur mystère
    const rows=sp.grid,s=72,gap=14,w0=rows[0].length*(s+gap)-gap;let yy=top+20;const x0=(W-w0)/2;
    for(const r of rows){r.forEach((c,i)=>{rrect(x,x0+i*(s+gap),yy,s,s,14);x.fillStyle=c==="c-ok"?"#2FB55A":c==="c-mid"?"#E2A83A":"rgba(255,255,255,.16)";x.fill()});yy+=s+gap}
    top=yy+10;
  }
  if(sp.players&&sp.players.length&&!sp.list){
    const ps=sp.players.slice(0,5),r=sp.players.length===1?190:86,gap=26,tw=ps.length*(2*r)+(ps.length-1)*gap;let cx=(W-tw)/2+r;const cy=Math.min(bottom-r-(sp.captions?70:20),Math.max(top+r+20,(top+bottom)/2-20));
    for(const p of ps){await avatarC(x,p,cx,cy,r);if(sp.captions){x.textAlign="center";x.fillStyle="#fff";x.font=F(800,ps.length===1?54:26);const nm=ps.length===1?NAME[p]:NAME[p].split(" ").slice(-1)[0];x.fillText(nm,cx,cy+r+(ps.length===1?78:42),2*r+20);if(sp.captions[p]){x.font=F(700,ps.length===1?32:24);x.fillStyle="rgba(255,255,255,.75)";x.fillText(sp.captions[p],cx,cy+r+(ps.length===1?124:74),2*r+20)}x.textAlign="left"}cx+=2*r+gap}
  }
  if(sp.list){ // lignes joueur + valeur
    const L=sp.list,h=Math.min(L.length>6?112:150,(bottom-top)/L.length);let yy=top;
    for(const it of L){rrect(x,64,yy,W-128,h-12,18);x.fillStyle="rgba(255,255,255,.08)";x.fill();
      const r=(h-12)/2-8;if(it.rank!=null){x.fillStyle="#E2BE6A";x.font=F(900,Math.min(44,h*.45));x.textAlign="center";x.fillText(String(it.rank),110,yy+(h-12)/2+15);x.textAlign="left"}
      const ax=it.rank!=null?190:64+20+r;await avatarC(x,it.p,ax,yy+(h-12)/2,r);
      x.fillStyle="#fff";x.font=F(800,Math.min(36,h*.34));x.fillText(NAME[it.p],ax+r+20,yy+(h-12)/2+(it.sub?-2:12),W-ax-r-260);
      if(it.sub){x.font=F(600,Math.min(24,h*.23));x.fillStyle="rgba(255,255,255,.7)";x.fillText(it.sub,ax+r+20,yy+(h-12)/2+30,W-ax-r-260)}
      if(it.val!=null){x.textAlign="right";x.font=F(900,Math.min(50,h*.48));x.fillStyle=it.col||"#fff";x.fillText(it.val,W-96,yy+(h-12)/2+17);x.textAlign="left"}
      yy+=h}
  }
  // pied : appel à jouer
  x.fillStyle="#fff";x.fillRect(0,1190,W,160);x.fillStyle="#ED2839";x.fillRect(0,1190,W,8);
  x.fillStyle="#151E22";x.font=F(800,30);x.fillText(sp.cta||"Et toi, tu fais mieux ?",64,1262);
  x.fillStyle="#002496";x.font=F(900,44);x.fillText("euroleague-france.com/jeux",64,1318);
  if(PSEUDO){x.textAlign="right";x.fillStyle="#5B666B";x.font=F(700,26);x.fillText("par "+PSEUDO,W-64,1262,360);x.textAlign="left"}
  return await new Promise(res=>cv.toBlob(res,"image/png"));
}

const PPOOL=pool(5);let PM=null;const PMS={streak:0,run:[]};
function newPM(){let a,b;do{a=rnd(PPOOL);b=rnd(PPOOL)}while(a===b||Math.abs(Math.round(ST[a].note*10)-Math.round(ST[b].note*10))<1);PM={a,b,pick:null}}
const PMCFG={g:"pm",what:"Meilleure série de la saison",unit:s=>plural(s,"bonne réponse","bonnes réponses")};
function pm(){
  if(!PM)newPM();const rec=LS.get("jx-pm",{best:0});
  const win=ST[PM.a].note>ST[PM.b].note?PM.a:PM.b,lose=win===PM.a?PM.b:PM.a;const shown=PM.pick!=null,good=PM.pick===win;
  const card=p=>{const s=ST[p];const cls=shown?(p===win?"ok":p===PM.pick?"ko":""):"";return `<button type="button" class="pcard ${cls}" data-p="${p}" ${shown?"disabled":""}>${av(p)}<b style="font-size:17px">${esc(NAME[p])}</b><span class="row muted" style="gap:6px;font-size:13px;justify-content:center">${logo(s.club)}${esc(CLUB[s.club]||s.club)}</span><span class="v" style="color:${shown?noteCol(s.note):"#C7CDD8"}">${shown?fr(s.note):"?"}</span><span class="muted" style="font-size:12px">${s.n} matchs</span></button>`};
  $("#app").innerHTML=`<div class="lay"><div class="card">
    <div class="row between"><span class="kick">Plus ou moins</span><span class="score">Record perso : ${rec.best}</span></div>
    <h2>Qui a la meilleure moyenne de notes ?</h2><p class="lead">Clique sur le joueur le mieux noté de la saison. Une erreur et ta série repart de zéro.</p>
    <div class="streak"><span class="n">${PMS.streak}</span><span class="l">bonne${PMS.streak>1?"s":""} réponse${PMS.streak>1?"s":""}<br>d’affilée</span></div>
    <div class="duel">${card(PM.a)}${card(PM.b)}<span class="vs" aria-hidden="true">VS</span></div>
    <div class="row between" style="margin-top:16px"><p class="msg" style="color:${shown?(good?"var(--ok)":"var(--ko)"):"inherit"}">${shown?(good?"Bien vu !":`Raté… Série terminée à ${PM.end}.`):""}</p>
      <div class="row">${shown&&!good&&PM.end>0?shareBtn("pms","Partager ma série"):""}${shown?`<button class="btn" id="pn" type="button">${good?"Duel suivant":"Rejouer"}</button>`:""}</div></div>
    <p class="muted" style="font-size:13px;margin:14px 0 0">Notes EuroLeague France ${esc(D.season)}, joueurs avec 5 matchs ou plus.</p>
  </div>${boardHTML()}</div>`;
  loadBoard(PMCFG);
  $$(".pcard[data-p]").forEach(b=>b.onclick=()=>{PM.pick=b.dataset.p;
    if(PM.pick===win){award([win],"pm");PMS.streak++;PMS.run.push([win,lose]);if(PMS.streak>rec.best){rec.best=PMS.streak;LS.set("jx-pm",rec)}clearTimeout(pm.t);const run=PMS.run.slice();pm.t=setTimeout(()=>submit({g:"pm",run},PMCFG),600)}
    else{PM.end=PMS.streak;PM.endRun=PMS.run.map(x=>x[0]);PMS.streak=0;PMS.run=[]}
    pm()});

const todayKey=new Intl.DateTimeFormat("fr-CA",{timeZone:"Europe/Paris",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const fnv=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};

async function mystPid(){
  if(MYST)return MYST;

  if(r&&r.t){try{const s=atob(r.t).split("|")[0].split("").reverse().join("");if(ST[s]){MYST=s;MNUM=r.num;return MYST}}catch(e){}}

}

function cmpNum(a,b,okT,midT){const d=b-a;const cls=Math.abs(d)<=okT?"c-ok":Math.abs(d)<=midT?"c-mid":"c-ko";const ar=Math.abs(d)<=okT?"":d>0?"↑":"↓";return {cls,ar}}

    {cls:c4.cls,h:`${fr(s.note)} ${c4.ar}`},{cls:c5.cls,h:`${fr(s.ev)} ${c5.ar}`},{cls:c6.cls,h:`${s.n} ${c6.ar}`}]};
}
const MYCFG={g:"myst",k:"saison",what:"Points : 8 si trouvé du 1er coup, 1 au 8e",unit:s=>"pts",tabs:[["saison","Saison"],["jour","Aujourd’hui"]]};

      ${st.done?`<span class="pill" style="background:${st.won?"var(--okbg)":"var(--kobg)"};color:${st.won?"var(--ok)":"var(--ko)"}">${st.won?`Trouvé en ${st.g.length} essai${st.g.length>1?"s":""} !`:"Perdu… À demain !"}</span>`:`<span class="pill">${left} essai${left>1?"s":""} restant${left>1?"s":""}</span>`}
    </div>
    <div class="row" style="gap:4px">
      <div class="stat"><b>${stats.played}</b><span>Joués</span></div>

/* =========================================================
   5. CLASSEMENT À L'AVEUGLE
   ========================================================= */
const GM={all:{lab:"Tous les joueurs",n:10},top50:{lab:"Les 50 meilleures notes",n:10},nat:{lab:"Par nationalité",n:5}};
const avMin=Math.max(1,Math.ceil(LAST/2));
const ELIG=Object.keys(ST).filter(p=>D.players[p]&&ST[p].n>=avMin).map(p=>({p,avg:ST[p].note})).sort((a,b)=>b.avg-a.avg);
const NATS=(()=>{const c={};ELIG.forEach(z=>{const k=ST[z.p].nat;if(k)c[k]=(c[k]||0)+1});return Object.keys(c).filter(k=>c[k]>=5).sort((a,b)=>c[b]-c[a])})();
let AVS=LS.get("jx-av",{m:"all",c:"FRA"});if(!GM[AVS.m])AVS.m="all";if(!NATS.includes(AVS.c))AVS.c=NATS[0]||"FRA";
let AV=null;
function avPool(){if(AVS.m==="top50")return ELIG.slice(0,50);if(AVS.m==="nat")return ELIG.filter(z=>ST[z.p].nat===AVS.c);return ELIG}
function avNew(){const N=GM[AVS.m].n;AV={m:AVS.m,c:AVS.c,N,pick:shuffle(avPool()).slice(0,N),i:0,slots:Array(N).fill(null),order:[],sent:false}}
function avEval(){const N=AV.N,TOL=0.049,unit=100/Math.floor(N*N/2);
  const rows=AV.slots.map((z,k)=>{const lo=1+AV.pick.filter(o=>o.avg>z.avg+TOL).length,hi=AV.pick.filter(o=>o.avg>=z.avg-TOL).length,s=k+1,d=s<lo?lo-s:s>hi?s-hi:0;return {p:z.p,s,lo,hi,d,avg:z.avg}});
  const F=rows.reduce((a,r)=>a+r.d,0);return {rows,F,score:Math.max(0,Math.round(100-unit*F))}}
const avTitle=()=>AV.m==="nat"?`Top 5 · ${PAYS[AV.c]||AV.c}`:`Top 10 · ${GM[AV.m].lab}`;
const AVCFG={g:"av",what:"Meilleur score de la saison (sur 100)",unit:s=>"/100"};
function aveugle(){
  if(!AV||AV.m!==AVS.m||(AV.m==="nat"&&AV.c!==AVS.c))avNew();
  const done=AV.i>=AV.N,ev=done?avEval():null,cur=done?null:AV.pick[AV.i];
  const byP=ev?Object.fromEntries(ev.rows.map(r=>[r.p,r])):{};
  const left=done?`<div class="avcard"><div class="k">Ton score</div><div class="big">${ev.score}<small>/100</small></div><div class="s">${ev.rows.filter(r=>r.d===0).length} bonne(s) place(s) sur ${AV.N}</div>
      <div class="row" style="justify-content:center;margin-top:14px">${shareBtn("ash")}<button class="btn ghost" id="aagain" type="button">Rejouer</button></div></div>`
    :`<div class="avcard"><div class="k">Joueur ${AV.i+1} / ${AV.N}</div>${av(cur.p)}<h3>${esc(NAME[cur.p])}</h3><div class="s">${esc(CLUB[ST[cur.p].club]||"")} · ${flag(ST[cur.p].nat)} ${esc(PAYS[ST[cur.p].nat]||"")}</div><p class="s" style="margin:10px 0 0;font-size:13px">Choisis sa place. Une fois posé, il ne bouge plus.</p></div>`;
  const slots=AV.slots.map((z,k)=>{
    if(!z)return `<li><button class="avslot" type="button" data-s="${k}" ${done?"disabled":""}><span class="rk">${k+1}</span>Placer ici</button></li>`;
    let v="";if(done){const r=byP[z.p],tr=r.lo===r.hi?String(r.lo):r.lo+"-"+r.hi;v=`<span class="tag ${r.d===0?"ok":r.d===1?"mid":"ko"}">${r.d===0?"✓ bonne place":"vrai rang : "+tr}</span><span class="note" style="color:${noteCol(z.avg)};background:${noteBg(z.avg)}">${fr(z.avg)}</span>`}
    return `<li><div class="avslot"><span class="rk">${k+1}</span>${av(z.p)}<span class="nm">${esc(NAME[z.p])}<small>${esc(CLUB[ST[z.p].club]||"")}</small></span>${v}</div></li>`}).join("");
  $("#app").innerHTML=`<div class="lay"><div class="card">
    <span class="kick">Classement à l’aveugle</span><h2>Classe-les sans voir leurs notes</h2>
    <p class="lead">Les joueurs sont tirés au sort un par un : place chacun dans ton classement sans connaître les suivants, puis compare avec leur moyenne de notes EuroLeague France.</p>
    <div class="row" style="margin-bottom:14px"><div class="seg" role="group" aria-label="Catégorie">${Object.keys(GM).map(k=>`<button type="button" data-m="${k}" aria-pressed="${k===AVS.m}">${GM[k].lab}</button>`).join("")}</div>
      ${AVS.m==="nat"?`<label class="sr" for="anat">Pays</label><select id="anat" style="height:36px;border-radius:18px;border:1.5px solid var(--line);padding:0 10px;font-weight:700">${NATS.map(k=>`<option value="${k}" ${k===AVS.c?"selected":""}>${flag(k)} ${esc(PAYS[k]||k)}</option>`).join("")}</select>`:""}
      <button class="link" id="anew" type="button">Nouveau tirage</button></div>
    <div class="avgame">${left}<ol class="avslots" aria-label="${esc(avTitle())}">${slots}</ol></div>
    <p class="muted" style="font-size:13px;margin:14px 0 0">Tu pars de 100 : chaque rang d’écart avec le vrai classement coûte des points. Deux joueurs à moyenne quasi égale sont ex aequo. Joueurs avec au moins ${avMin} matchs.</p>
  </div>${boardHTML()}</div>`;
  loadBoard(AVCFG);
  $$("[data-m]").forEach(b=>b.onclick=()=>{AVS.m=b.dataset.m;LS.set("jx-av",AVS);aveugle()});
  const sel=$("#anat");if(sel)sel.onchange=()=>{AVS.c=sel.value;LS.set("jx-av",AVS);aveugle()};
  $("#anew").onclick=()=>{avNew();aveugle()};
  $$("[data-s]").forEach(b=>b.onclick=()=>{const k=+b.dataset.s;if(AV.slots[k]||AV.i>=AV.N)return;const z=AV.pick[AV.i++];AV.slots[k]=z;AV.order.push([z.p,k+1]);
    if(AV.i>=AV.N&&!AV.sent){AV.sent=true;submit({g:"av",order:AV.order},AVCFG);award(avEval().rows.filter(r=>r.d===0).map(r=>r.p),"av")}aveugle()});
  const a=$("#aagain");if(a)a.onclick=()=>{avNew();aveugle()};
  const s=$("#ash");if(s)s.onclick=()=>{const e=avEval();shareScore({kicker:`Classement à l’aveugle · ${avTitle()}`,title:`${e.score}/100`,list:AV.slots.map((z,k)=>{const r=e.rows[k];return {rank:k+1,p:z.p,sub:r.d===0?"bonne place":"vrai rang",val:r.d===0?"✓":(r.lo===r.hi?String(r.lo):r.lo+"-"+r.hi),col:r.d===0?"#5BE38A":"rgba(255,255,255,.6)"}}),cta:`${e.rows.filter(r=>r.d===0).length} bonne(s) place(s). Et toi ?`},`🏀 ${e.score}/100 au classement à l’aveugle d’EuroLeague France (${avTitle()}). Et toi, tu classes mieux ?`,"classement-aveugle")};
}

function cinq(){
  const R=LAST,ms=roundMatches(R),ids=new Set(ms.map(m=>m.id));
  const rows=D.notes.filter(n=>ids.has(n[1])&&n[3]>=10);
  const byM={};for(const n of rows)(byM[n[1]]||(byM[n[1]]=[])).push(n);
  const NOTE={},CL={};for(const n of rows){NOTE[n[0]]=n[6];CL[n[0]]=n[2]}
  const key="jx-5-"+R;let st=LS.get(key,{pick:[],done:false});

let OWN=new Set(LS.get("jx-col",[]));let PACK_OK=false;const LIMIT=10;let TODAY=LS.get("jx-colday",{d:todayKey,n:0});if(TODAY.d!==todayKey)TODAY={d:todayKey,n:0};

const NEWQ=[];let NEWBUSY=false;
function award(pids,src){
  const nw=[...new Set(pids)].filter(p=>p&&ST[p]&&ST[p].club&&!OWN.has(p));if(!nw.length)return;
  const left=LIMIT-TODAY.n;
  if(left<=0){if(!award.warned){award.warned=1;toast(`Limite du jour atteinte : ${LIMIT} cartes. Reviens demain !`)}return}
  const take=nw.slice(0,left);take.forEach(p=>OWN.add(p));setToday(TODAY.n+take.length);saveOwn();colPill();
  api("scores",{add:take,src}).then(r=>{if(r&&Array.isArray(r.added)){take.filter(p=>!r.added.includes(p)).forEach(p=>OWN.delete(p));if(typeof r.today==="number")setToday(r.today);saveOwn();colPill()}});

      return `<div class="tcol"><div data-cc="${p}"></div><div><div class="roles">${ROLES.map(([k,l])=>`<button type="button" class="role ${k}" data-p="${p}" data-r="${k}" aria-pressed="${r===k}" ${done?"disabled":""}>${l}</button>`).join("")}</div>
        ${res?`<div class="res">${ROLES.map(([k,l,col])=>{const v=Math.round(100*(c?c[k]:0)/tot);return `<div><span>${l}</span><i><b style="width:${v}%;background:${col}"></b></i><span>${v} %</span></div>`}).join("")}</div>`:""}</div></div>`}).join("")}</div>
    <div class="row between" style="margin-top:16px"><p class="msg">${res?`${res.n} lecteur${res.n>1?"s ont":" a"} joué ce trio. ${agree(res,ans)}`:ready?"Prêt ?":"Attribue un rôle à chaque joueur."}</p>
      <div class="row">${res?shareBtn("tsh","Partager mon trio"):""}${res?(i+1<TR.length?`<button class="btn" id="tn" type="button">Trio suivant</button>`:`<span class="muted">5 nouveaux trios demain.</span>`):`<button class="btn red" id="tv" type="button" ${ready?"":"disabled"}>Valider mon choix</button>`}</div></div></div>`;
  $("#app").innerHTML=html;
  tr.forEach(p=>{const h=document.querySelector(`[data-cc="${p}"]`);if(h)h.appendChild(cardCanvas(p,Math.min(260,h.clientWidth||240)))});
  $$(".role[data-p]").forEach(b=>b.onclick=()=>{const p=b.dataset.p,k=b.dataset.r;for(const r of Object.keys(ans))if(ans[r]===p)delete ans[r];ans[k]=p;st.a[i]=ans;LS.set(key,st);trio()});
  const v=$("#tv");if(v)v.onclick=async()=>{v.disabled=true;const r=await api("scores",{trio:{i,t:ans.t,r:ans.r,v:ans.v}});if(r&&!r.error){st.res[i]=r;LS.set(key,st);award([ans.t],"trio");trio()}else{toast(r.error||"Réessaie");v.disabled=false}};
  const n=$("#tn");if(n)n.onclick=()=>{st.i=i+1;LS.set(key,st);trio()};
  const sh=$("#tsh");if(sh)sh.onclick=()=>shareCustom(async x=>{
    x.textAlign="center";x.fillStyle="#E2BE6A";x.font=FF(800,30);ls(x,6);x.fillText("TITULAIRE · BANC · VENDU",540,150);ls(x,0);
    const W=300;for(let j=0;j<3;j++){const [k,l,col]=ROLES[j],p=ans[k],X=60+j*(W+30),Y=300;
      rrect(x,X+30,200,W-60,58,29);x.fillStyle=col;x.fill();x.fillStyle="#fff";x.font=FF(900,28);ls(x,3);x.fillText(l.toUpperCase(),X+W/2,239);ls(x,0);
      await drawCard(x,p,X,Y,W,{shadow:true});
      const c=res.c[p],v=Math.round(100*(c?c[k]:0)/Math.max(1,res.n));x.fillStyle="#fff";x.font=FF(800,30);x.fillText(`${v} % d’accord`,X+W/2,Y+W*1.4+56)}
    x.textAlign="left";
  },`🏀 Titulaire : ${NAME[ans.t]} · Banc : ${NAME[ans.r]} · Vendu : ${NAME[ans.v]}. Et toi ?`,"titulaire-banc-vendu","Et toi, tu fais quoi ?");
  function agree(res,ans){const m=["t","r","v"].filter(k=>{const c=res.c[ans[k]];return c&&c[k]>=Math.max(c.t,c.r,c.v)}).length;return m===3?"Tu es d’accord avec la majorité sur toute la ligne.":m===0?"Tu as fait l’inverse de la majorité !":`Tu es d’accord avec la majorité sur ${m} choix.`}
}

/* =========================================================
   L'INTRUS
   ========================================================= */
let IN=null;const INS={streak:0,run:[]};
const INCFG={g:"intrus",what:"Meilleure série d’intrus trouvés",unit:s=>plural(s,"intrus","intrus")};
const WHY=(k,v,neg)=>{if(k==="club")return `jouent tous à ${CLUB[v]||v}`;if(k==="nat")return `ont tous la même nationalité (${PAYS[v]||v})`;if(k==="pos")return `sont tous ${({G:"arrières",F:"ailiers",C:"pivots"})[v]}`;return v==="12+"?"tournent tous à 12 points ou plus par match":"tournent tous à moins de 12 points par match"};
function intrus(){
  if(!IN){IN=L.makeIntrus(ST);if(IN)IN.pick=null}
  if(!IN){$("#app").innerHTML='<div class="card"><h2>L’intrus</h2><p class="lead">Jeu indisponible pour le moment.</p></div>';return}
  const rec=LS.get("jx-intrus",{best:0}),shown=IN.pick!=null,good=IN.pick===IN.intruder,why=L.intrusWhy(ST,IN.four,IN.intruder);
  $("#app").innerHTML=`<div class="lay"><div class="card"><div class="row between"><span class="kick">L’intrus</span><span class="score">Record perso : ${rec.best}</span></div>
    <h2>Trois ont un point commun. Trouve l’intrus !</h2><p class="lead">Même club, même nationalité, même poste, ou même niveau de points par match : un seul joueur ne colle pas.</p>
    <div class="streak"><span class="n">${INS.streak}</span><span class="l">intrus trouvé${INS.streak>1?"s":""}<br>d’affilée</span></div>
    <div class="four">${IN.four.map(p=>{const s=ST[p],cls=shown?(p===IN.intruder?"ok":p===IN.pick?"ko":""):"";return `<button type="button" class="icard ${cls}" data-p="${p}" ${shown?"disabled":""}>${av(p)}<b>${esc(NAME[p])}</b>${shown?`<span class="facts"><img src="../logos/${s.club}.webp" alt="">${esc(s.club)} · ${flag(s.nat)} · ${esc(POSAB[s.pos]||"")}${s.ppg!=null?" · "+fr(s.ppg)+" pts":""}</span>`:""}</button>`}).join("")}</div>
    <div class="row between" style="margin-top:16px"><p class="msg" style="color:${shown?(good?"var(--ok)":"var(--ko)"):"inherit"}">${shown?`${good?"Bien vu !":"Raté…"} ${esc(NAME[IN.intruder])} était l’intrus : les trois autres ${esc(WHY(why[0],why[1]))}.`:""}</p>
      <div class="row">${shown&&!good&&IN.end>0?shareBtn("ish","Partager ma série"):""}${shown?`<button class="btn" id="inx" type="button">${good?"Suivant":"Rejouer"}</button>`:""}</div></div>
  </div>${boardHTML()}</div>`;
  loadBoard(INCFG);
  $$(".icard[data-p]").forEach(b=>b.onclick=()=>{IN.pick=b.dataset.p;
    if(IN.pick===IN.intruder){INS.streak++;INS.run.push([IN.four,IN.intruder]);if(INS.streak>rec.best){rec.best=INS.streak;LS.set("jx-intrus",rec)}award([IN.intruder],"intrus");const run=INS.run.slice();submit({g:"intrus",run},INCFG)}
    else{IN.end=INS.streak;IN.endRun=INS.run.map(x=>x[1]);INS.streak=0;INS.run=[]}
    intrus()});
  const n=$("#inx");if(n)n.onclick=()=>{IN=null;intrus()};
  const s=$("#ish");if(s)s.onclick=()=>shareScore({kicker:"L’intrus",title:"Je trouve l’intrus à chaque fois",big:IN.end,bigLabel:`intrus trouvé${IN.end>1?"s":""} d’affilée`,players:IN.endRun.slice(-5)},`🕵️ ${IN.end} intrus trouvé${IN.end>1?"s":""} d’affilée sur EuroLeague France. À toi !`,"intrus");
}

function go(id,push){id=ALIAS[id]||id;const x=TABS.find(t=>t.id===id)||TABS[0];CUR=x.id;tabsHTML();colPill();$$(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===x.id));if(push)history.replaceState(null,"","#"+x.id);BOARD=null;x.f();const b=$("#t-"+x.id);if(b)b.scrollIntoView({block:"nearest",inline:"nearest"})}
window.addEventListener("hashchange",()=>go(location.hash.slice(1)));
go(location.hash.slice(1));
})();
