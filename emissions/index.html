<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Émissions YouTube · EuroLeague France</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--blue:#002395;--red:#ED2939;--bg:#F3F7FB;--surface:#fff;--ink:#0E1A3A;--muted:#55627E;--line:#D7E2EE;
  --fd:"Saira Condensed","Arial Narrow",Arial,sans-serif;--fb:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;background:#fff;border-radius:12px;padding:14px 18px;border:1px solid var(--line);position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--blue) 0 50%,var(--red) 50% 100%)}
.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-width:0}
.brand img{height:62px;width:auto;max-width:100%;display:block}
.tag{font-family:var(--fd);font-weight:800;font-size:clamp(22px,3.4vw,32px);line-height:1;text-transform:uppercase;color:var(--blue);letter-spacing:.02em}
.tag span{color:var(--red)}
.sub{display:inline-flex;align-items:center;gap:8px;background:#FF0000;color:#fff;text-decoration:none;font-weight:700;padding:10px 16px;border-radius:999px;box-shadow:0 4px 12px rgba(255,0,0,.25)}
.sub:hover{filter:brightness(1.08)}
.sub svg{width:20px;height:20px}
h2{font-family:var(--fd);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:28px 0 12px;color:var(--blue)}
h2::before{content:"";display:inline-block;width:10px;height:10px;background:var(--red);margin-right:8px;vertical-align:2px;transform:skewX(-12deg)}
.count{font-family:var(--fb);font-size:13px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;margin-left:6px}
button.v{all:unset;cursor:pointer;display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:transform .15s,box-shadow .15s}
button.v:hover,button.v:focus-visible{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,35,149,.16);border-color:var(--red)}
button.v:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.th{position:relative;aspect-ratio:16/9;background:#0B1638;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:700;padding:2px 6px;border-radius:4px}
.play{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .15s;background:rgba(0,11,51,.25)}
.play i{width:64px;height:44px;border-radius:12px;background:#FF0000;display:grid;place-items:center}
.play i::after{content:"";border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:4px}
button.v:hover .play,button.v:focus-visible .play{opacity:1}
.new{position:absolute;left:8px;top:8px;background:var(--red);color:#fff;font-family:var(--fd);font-weight:800;font-size:13px;letter-spacing:.06em;padding:3px 8px;border-radius:6px;text-transform:uppercase}
.meta{padding:10px 12px 12px}
.kick{font-family:var(--fd);font-weight:800;font-size:13px;letter-spacing:.06em;color:var(--red);text-transform:uppercase}
.ttl{font-weight:700;font-size:15px;line-height:1.3;margin:2px 0 6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.date{font-size:12.5px;color:var(--muted)}
button.v.feat{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:center}
.feat .meta{padding:20px;display:flex;flex-direction:column;justify-content:center}
.feat .ttl{font-family:var(--fd);font-size:clamp(22px,2.6vw,30px);font-weight:800;text-transform:uppercase;line-height:1.08;-webkit-line-clamp:4}
.feat .cta{margin-top:14px;align-self:flex-start;background:var(--red);color:#fff;font-weight:700;padding:9px 16px;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:16px}
.feat .meta .date{margin-top:2px}
@media (max-width:760px){button.v.feat{grid-template-columns:1fr}.feat .meta{padding:14px}}
dialog{border:0;padding:0;background:#000;width:min(1100px,calc(100vw - 24px));border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(5,10,30,.82)}
.player{position:relative;aspect-ratio:16/9;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0B1638;color:#fff}
.pbar b{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar a{color:#fff;font-size:13px;font-weight:700;text-decoration:none;border:1px solid rgba(255,255,255,.35);padding:6px 10px;border-radius:8px;white-space:nowrap}
.pbar button{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;width:34px;height:34px;border-radius:8px;font-size:18px;cursor:pointer}
.empty{color:var(--muted);padding:20px 0}
.tops{margin-top:12px;background:#12151F;border:1px solid #232838;border-radius:12px;padding:12px 14px}
.tops h3{margin:0 0 8px;font-family:var(--fd);font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:#fff}
.tops h3 span{color:#FF5A66}
.tp{all:unset;cursor:pointer;display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:4px 12px;align-items:start;width:100%;box-sizing:border-box;padding:10px 8px;border-top:1px solid #232838;border-radius:8px;color:#fff}
.tp:first-of-type{border-top:0}
.tp:hover,.tp:focus-visible{background:#1B2030}
.tp:focus-visible{outline:2px solid var(--red)}
.tp .md{font-size:22px;line-height:1}
.tp .tc{font-family:var(--fd);font-weight:800;font-size:15px;background:var(--red);color:#fff;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tp b{font-size:15px;line-height:1.3}
.tp small{grid-column:3;color:rgba(255,255,255,.7);font-size:13.5px;line-height:1.4}
@media (max-width:560px){.tp{grid-template-columns:auto minmax(0,1fr)}.tp .md{display:none}.tp small{grid-column:1 / -1}}
/* Saison en cours : bloc noir mis en avant */
.cur{margin-top:22px;background:#07090F;border-radius:16px;padding:6px 18px 22px;box-shadow:0 18px 40px rgba(7,9,15,.28);position:relative;overflow:hidden}
.cur::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--blue) 0 50%,var(--red) 50% 100%)}
.cur h2{color:#fff}
.cur .count{color:rgba(255,255,255,.6)}
.cur button.v{background:#12151F;border-color:#232838;color:#fff}
.cur button.v:hover,.cur button.v:focus-visible{border-color:var(--red);box-shadow:0 14px 30px rgba(0,0,0,.55)}
.cur .ttl{color:#fff}.cur .date{color:rgba(255,255,255,.6)}.cur .kick{color:#FF5A66}
.cur .th{background:#000}
/* Saisons précédentes : un cran en dessous */
.past h2{font-size:19px;color:var(--muted)}
.past h2::before{background:var(--muted)}
.past .grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.past button.v{opacity:.92}.past button.v:hover{opacity:1}
.past .ttl{font-size:14px;-webkit-line-clamp:2}
.past .meta{padding:8px 10px 10px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><img src="../logo.png" alt="EuroLeague France" width="640" height="155"><span class="tag">Les émissions <span>YouTube</span></span></div>
    <a class="sub" href="https://www.youtube.com/@EuroLeagueFrance?sub_confirmation=1" target="_blank" rel="noopener"><svg viewBox="0 0 576 512" fill="currentColor" aria-hidden="true"><path d="M549.7 124.1c-6.3-23.7-24.8-42.3-48.3-48.6C458.8 64 288 64 288 64S117.2 64 74.6 75.5c-23.5 6.3-42 24.9-48.3 48.6C14.9 167 14.9 256.4 14.9 256.4s0 89.4 11.4 132.3c6.3 23.6 24.8 41.5 48.3 47.8C117.2 448 288 448 288 448s170.8 0 213.4-11.5c23.5-6.3 42-24.2 48.3-47.8 11.4-42.9 11.4-132.3 11.4-132.3s0-89.4-11.4-132.3zM232.2 337.6V175.2l142.7 81.2-142.7 81.2z"/></svg>S'abonner à la chaîne</a>
  </header>
  <main id="app"><p class="empty">Chargement des vidéos…</p></main>
</div>
<dialog id="dlg" aria-label="Lecture de la vidéo"><div class="player" id="pl"></div><div class="pbar"><b id="pt"></b><a id="py" target="_blank" rel="noopener">Voir sur YouTube</a><button id="px" aria-label="Fermer">×</button></div></dialog>
<script>
(function(){
  const $=s=>document.querySelector(s);
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  const dateFr=s=>{const [y,m,d]=s.slice(0,10).split("-").map(Number);return `${d} ${MOIS[m-1]} ${y}`};
  const dur=n=>{if(!n)return "";const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0")};
  // « FINAL4FOUR BY EUROLEAGUE FRANCE #18 : TITRE 🏀 » → surtitre « Final4Four #18 » + titre
  function split(t){t=t.replace(/\s*🏀\s*$/,"").trim();const m=t.match(/^(?:FINAL4FOUR|F4)\s+BY\s+EUROLEAGUE(?:\s+FRANCE)?\s*(?:-\s*)?(.*?)\s*:\s*(.+)$/i);
    if(!m)return {k:"EuroLeague France",t};let k=m[1].trim();k=k?("Final4Four · "+k):"Final4Four";return {k,t:m[2]}}
  function card(v,feat,isNew){const s=split(v.title);
    return `<button class="v${feat?" feat":""}" data-id="${esc(v.id)}" data-t="${esc(v.title)}"><div class="th"><img src="https://i.ytimg.com/vi/${esc(v.id)}/${feat?"maxresdefault":"hqdefault"}.jpg" alt="" loading="${feat?"eager":"lazy"}" onload="if(this.naturalWidth<200&&!this.dataset.f){this.dataset.f=1;this.src='https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg'}" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg'}">${isNew?'<span class="new">Nouveau</span>':""}${v.len?`<span class="dur">${dur(v.len)}</span>`:""}<span class="play"><i></i></span></div>
      <div class="meta"><div class="kick">${esc(s.k)}</div><div class="ttl">${esc(s.t)}</div><div class="date">${dateFr(v.date)}</div>${feat?'<span class="cta">▶ Regarder la dernière émission</span>':""}</div></button>`}
  const tc=n=>{const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0")};
  const tops=v=>!v.top||!v.top.length?"":`<div class="tops"><h3>Le top 3 <span>de l'émission</span></h3>${v.top.map((x,i)=>`<button class="tp" data-id="${esc(v.id)}" data-t="${esc(v.title)}" data-s="${x.t}"><span class="md">${["🥇","🥈","🥉"][i]||""}</span><span class="tc">▶ ${tc(x.t)}</span><span><b>${esc(x.title)}</b></span><small>${esc(x.txt)}</small></button>`).join("")}</div>`;
  function render(list){list.sort((a,b)=>b.date.localeCompare(a.date));
    if(!list.length){$("#app").innerHTML='<p class="empty">Aucune vidéo pour le moment.</p>';return}
    const fresh=Date.now()-new Date(list[0].date+"Z").getTime()<8*864e5;
    // saison EuroLeague : d'août à juillet
    const ssn=d=>{const y=+d.slice(0,4),m=+d.slice(5,7);return m>=8?y:y-1},lab=y=>`Saison ${y}-${String(y+1).slice(2)}`;
    const cy=ssn(list[0].date),cur=list.filter(v=>ssn(v.date)===cy),old=list.filter(v=>ssn(v.date)!==cy);
    const yrs=[...new Set(old.map(v=>ssn(v.date)))].sort((a,b)=>b-a);
    const n=k=>`${k} émission${k>1?"s":""}`;
    $("#app").innerHTML=`<section class="cur"><h2>${lab(cy)} <span class="count">${n(cur.length)} · la plus récente en premier</span></h2>
        ${card(cur[0],true,fresh)}${tops(cur[0])}
        ${cur.length>1?`<div class="grid" style="margin-top:16px">${cur.slice(1).map(v=>card(v,false,false)).join("")}</div>`:""}</section>
      ${yrs.map(y=>{const L=old.filter(v=>ssn(v.date)===y);return `<section class="past"><h2>${lab(y)} <span class="count">${n(L.length)}</span></h2><div class="grid">${L.map(v=>card(v,false,false)).join("")}</div></section>`}).join("")}`}
  const dlg=$("#dlg");
  function open(id,t,st){$("#pl").innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0${st?"&start="+st:""}" title="${esc(t)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    $("#pt").textContent=t.replace(/\s*🏀\s*$/,"");$("#py").href="https://www.youtube.com/watch?v="+encodeURIComponent(id)+(st?"&t="+st+"s":"");dlg.showModal()}
  const close=()=>{dlg.close()};
  dlg.addEventListener("close",()=>{$("#pl").innerHTML=""});
  $("#px").addEventListener("click",close);
  dlg.addEventListener("click",e=>{if(e.target===dlg)close()});
  document.addEventListener("click",e=>{const b=e.target.closest("button.v,button.tp");if(b)open(b.dataset.id,b.dataset.t,+b.dataset.s||0)});
  // archive complète + dernières vidéos du flux YouTube (ajoutées automatiquement)
  const A=fetch("videos.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>({videos:[]}));
  const F=fetch("/api/videos").then(r=>r.ok?r.json():{videos:[]}).catch(()=>({videos:[]}));
  Promise.all([A,F]).then(([a,f])=>{const m=new Map();(a.videos||[]).forEach(v=>m.set(v.id,v));(f.videos||[]).forEach(v=>{if(!m.has(v.id))m.set(v.id,v)});render([...m.values()])});
})();
</script>
</body>
</html>
