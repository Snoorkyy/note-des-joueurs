<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:SC;font-weight:800;src:url(a/saira-condensed-latin-800-normal.woff2);unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F}
@font-face{font-family:SC;font-weight:800;src:url(a/saira-condensed-latin-ext-800-normal.woff2);unicode-range:U+0100-02AF,U+1E00-1EFF}
@font-face{font-family:SC;font-weight:700;src:url(a/saira-condensed-latin-700-normal.woff2);unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F}
@font-face{font-family:SS;font-weight:700;src:url(a/source-sans-3-latin-700-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:SS;font-weight:700;src:url(a/source-sans-3-latin-ext-700-normal.woff2);unicode-range:U+0100-02AF,U+1E00-1EFF}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:860px;overflow:hidden;background:#05091C;font-family:SS;color:#F4F6FF}
.c{position:relative;width:1200px;height:860px;overflow:hidden;
 background:radial-gradient(60% 55% at 90% 0%,rgba(255,45,58,.38),transparent 70%),radial-gradient(60% 60% at 0% 100%,rgba(0,58,255,.45),transparent 70%),linear-gradient(180deg,#0A1236,#05091C 60%)}
.grain{position:absolute;inset:0;background:repeating-linear-gradient(118deg,rgba(255,255,255,.028) 0 2px,transparent 2px 26px)}
.pill{position:absolute;left:48px;top:40px;font-family:SC;font-weight:800;font-size:20px;letter-spacing:.18em;color:#05091C;background:#FFB547;padding:8px 16px;border-radius:999px}
.lg{position:absolute;left:48px;bottom:36px;height:40px}
h1{position:absolute;left:48px;top:92px;font-family:SC;font-weight:800;font-size:84px;line-height:.86;text-transform:uppercase}
h1 em{font-style:normal;background:linear-gradient(90deg,#FFB547,#FF5A64);-webkit-background-clip:text;color:transparent}
.sub{position:absolute;left:50px;top:254px;font-family:SC;font-weight:700;font-size:22px;letter-spacing:.14em;color:#8E9AC4;text-transform:uppercase}
.mvp{position:absolute;left:48px;top:300px;width:520px;height:480px;border-radius:32px;overflow:hidden;background:linear-gradient(170deg,#1D2F78,#0E1A4A 55%,#0A1236);border:1px solid rgba(255,255,255,.12);box-shadow:0 26px 70px rgba(0,0,0,.55)}
.mvp .glow{position:absolute;left:62%;top:42%;width:460px;height:460px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,181,71,.35),transparent 65%)}
.mvp .cut{position:absolute;right:-10px;top:14px;height:470px;filter:drop-shadow(0 18px 26px rgba(0,0,0,.5))}
.mvp .rnd{position:absolute;right:30px;top:60px;width:260px;height:260px;border-radius:50%;background:#E8EFF8 center/cover;border:6px solid rgba(255,255,255,.25)}
.mvp .shade{position:absolute;left:0;right:0;bottom:0;height:260px;background:linear-gradient(transparent,rgba(5,9,28,.92) 60%)}
.mvp .lab{position:absolute;left:28px;top:26px;font-family:SC;font-weight:800;font-size:24px;letter-spacing:.22em;color:#FFB547}
.mvp .cl{position:absolute;left:28px;top:66px;width:62px;height:62px;border-radius:50%;background:#fff;display:grid;place-items:center}.mvp .cl img{width:46px;height:46px;object-fit:contain}
.mvp .nm{position:absolute;left:28px;right:160px;bottom:66px;font-family:SC;font-weight:800;font-size:62px;line-height:.86;text-transform:uppercase}
.mvp .st{position:absolute;left:30px;bottom:26px;font-weight:700;font-size:19px;color:#C2CBEF}
.mvp .nt{position:absolute;right:24px;bottom:26px;width:124px;height:98px;border-radius:24px;display:grid;place-items:center;font-family:SC;font-weight:800;font-size:76px;color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.g{position:absolute;left:596px;top:40px;width:556px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.r{position:relative;height:362px;border-radius:26px;overflow:hidden;background:linear-gradient(165deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12)}
.r .cut{position:absolute;left:50%;top:34px;height:300px;transform:translateX(-50%);filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.r .rnd{position:absolute;left:50%;top:50px;width:150px;height:150px;transform:translateX(-50%);border-radius:50%;background:#E8EFF8 center/cover}
.r .shade{position:absolute;left:0;right:0;bottom:0;height:170px;background:linear-gradient(transparent,rgba(5,9,28,.95) 55%)}
.r .k{position:absolute;left:18px;top:16px;font-family:SC;font-weight:800;font-size:20px;letter-spacing:.2em;color:#8E9AC4}
.r .cl{position:absolute;right:14px;top:12px;width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center}.r .cl img{width:32px;height:32px;object-fit:contain}
.r .nm{position:absolute;left:18px;right:96px;bottom:20px;font-family:SC;font-weight:800;font-size:32px;line-height:.92;text-transform:uppercase}
.r .nt{position:absolute;right:14px;bottom:18px;width:76px;height:56px;border-radius:15px;display:grid;place-items:center;font-family:SC;font-weight:800;font-size:38px;color:#fff}
.url{position:absolute;right:48px;bottom:40px;font-family:SC;font-weight:800;font-size:20px;letter-spacing:.14em;color:#8E9AC4}
.st3{position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,#002395 0 33.3%,#fff 33.3% 66.6%,#ED2939 66.6%)}
</style></head><body><div class="c"><div class="grain"></div><div id="x"></div><div class="st3"></div></div>
<script>
const NC=n=>n>=8.5?"#17633A":n>=7?"#2E8048":n>=5.5?"#6F7F3F":n>=4.5?"#B08816":n>=3?"#C4521E":"#A01E16";
const fr=n=>(Math.round(n*2)/2).toFixed(1).replace('.0','').replace('.',',');
const pic=p=>p.cut?`<img class="cut" src="${p.cut}">`:`<div class="rnd" style="${p.photo?`background-image:url(../../photos/${p.id}.webp)`:''}"></div>`;
window.render=D=>{const [m,...o]=D.five;
 document.getElementById('x').innerHTML=`<div class="pill">${D.pill}</div>
 <h1>Le cinq de<br><em>la semaine</em></h1><div class="sub">${D.sub}</div>
 <div class="mvp"><div class="glow"></div>${pic(m)}<div class="shade"></div><div class="lab">★ MVP</div><div class="cl"><img src="../../logos/${m.club}.webp"></div>
  <div class="nm">${m.fra?'🇫🇷 ':''}${m.n.replace(' ','<br>')}</div><div class="st">${m.mt}</div><div class="nt" style="background:${NC(m.note)}">${fr(m.note)}</div></div>
 <div class="g">${o.map((p,i)=>`<div class="r">${pic(p)}<div class="shade"></div><div class="k">N°${i+2}</div><div class="cl"><img src="../../logos/${p.club}.webp"></div>
  <div class="nm">${p.fra?'🇫🇷 ':''}${p.n.replace(' ','<br>')}</div><div class="nt" style="background:${NC(p.note)}">${fr(p.note)}</div></div>`).join('')}</div>
 <img class="lg" src="../../logo_white.png"><div class="url">EUROLEAGUE-FRANCE.COM · LA LETTRE DU SAMEDI</div>`;
 return document.fonts.ready.then(()=>Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})))).then(()=>new Promise(r=>setTimeout(r,300)))};
</script></body></html>
