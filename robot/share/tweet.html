<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:SS;font-weight:400;src:url(a/source-sans-3-latin-400-normal.woff2)}
@font-face{font-family:SS;font-weight:700;src:url(a/source-sans-3-latin-700-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:SS;font-weight:700;src:url(a/source-sans-3-latin-ext-700-normal.woff2);unicode-range:U+0100-02AF,U+1E00-1EFF}
@font-face{font-family:SC;font-weight:800;src:url(a/saira-condensed-latin-800-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;background:#05091C;font-family:SS,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#E7E9EA}
.w{padding:0}
.t{background:#000;border:2px solid #2F3336;border-radius:36px;padding:44px 48px 36px}
.h{display:flex;align-items:center;gap:20px}
.h img.av{width:96px;height:96px;border-radius:50%}
.h .n{font-weight:700;font-size:38px;color:#E7E9EA;display:flex;align-items:center;gap:10px}
.h .ck{width:34px;height:34px;border-radius:50%;background:#1D9BF0;display:inline-grid;place-items:center;color:#fff;font-size:22px;font-weight:700}
.h .u{font-size:32px;color:#71767B}
.h .x{margin-left:auto;font-family:SC;font-weight:800;font-size:64px;color:#E7E9EA;line-height:1}
.tx{font-size:40px;line-height:1.38;margin-top:28px;white-space:pre-wrap;word-wrap:break-word}
.tx .hl{color:#1D9BF0}
.m{margin-top:28px;border-radius:30px;overflow:hidden;border:2px solid #2F3336}
.m img{display:block;width:100%;max-height:760px;object-fit:cover;object-position:top}
.d{margin-top:26px;font-size:30px;color:#71767B;display:flex;justify-content:space-between;align-items:center}
.d b{font-family:SC;font-weight:800;color:#1D9BF0;font-size:30px;letter-spacing:.08em}
</style></head><body><div class="w" id="w"></div>
<script>
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
window.render=D=>{document.getElementById('w').innerHTML=`<div class="t"><div class="h"><img class="av" src="${D.avatar}"><div><div class="n">${esc(D.name)} <span class="ck">✓</span></div><div class="u">@${D.handle}</div></div><div class="x">𝕏</div></div>
 <div class="tx">${esc(D.text).replace(/(#\w+|@\w+)/g,'<span class="hl">$1</span>')}</div>
 ${D.img?`<div class="m"><img src="${D.img}"></div>`:''}<div class="d"><span>${D.date}</span><b>VOIR SUR X →</b></div></div>`;
 return document.fonts.ready.then(()=>Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})))).then(()=>new Promise(r=>setTimeout(r,300)))};
</script></body></html>
