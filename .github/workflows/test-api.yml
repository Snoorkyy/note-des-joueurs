name: Test accès API EuroLeague
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://live.euroleague.net/api/Header?gamecode=98&seasoncode=E2026" "https://live.euroleague.net/api/PlayByPlay?gamecode=98&seasoncode=E2026" "https://api-live.euroleague.net/v3/competitions/E/seasons/E2026/rounds/10/basicstandings"; do
            echo "$u -> $(curl -s -o /tmp/o -w '%{http_code} %{size_download}' -A 'Mozilla/5.0' "$u")"; head -c 200 /tmp/o; echo; done
