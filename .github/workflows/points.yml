name: Points des joueurs (jeux)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-json
  cancel-in-progress: false
jobs:
  points:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rattraper les points de chaque joueur
        run: python3 robot/points.py
      - name: Enregistrer
        run: |
          git config user.name "EuroLeague France"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && exit 0
          git commit -m "Points des joueurs par match (jeux)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
