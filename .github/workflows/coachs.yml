name: Photos des coachs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: Télécharger et recadrer (tête, 96 px, webp)
        run: |
          python3 - <<'PY'
          import io, urllib.request
          from PIL import Image
          B = "https://media-cdn.cortextech.io/1dU3kpCqReRp93/"
          U = {"IST":"1BSdBWIjCjnONz/4d767dd3-99ea-4d1d-9e5e-34a6f93ff354.png", "MIL":"1BSdBWIjCjnONy/19f254fc-591b-49ae-b10b-76e6ea230d53.png", "BES":"1BSdBWIjCjnONy/a4a471f7-bf96-44fa-a448-44942f997945.png", "RED":"1BSdBWIjCjnONz/c653a1fc-ecb1-43d9-b799-477d0e6abb11.png", "DUB":"1BSdBWIjCjnONy/07f53b29-be6a-4abf-847b-d5675c53da18.png", "BAR":"1BSdBWIjCjnONz/953e6992-191c-4c7f-a176-fbfae696c7a7.png", "MUN":"1BSdBWIjCjnONy/406f1747-ffb8-4ffe-bfe4-4a58c01ff31b.png", "ULK":"1BSdBWIjCjnONx/503bc27c-d1e7-40b9-9bab-16b29c5d2bec.png", "HTA":"1BSdBWIjCjnOS3/bee757b8-0a6b-4204-919d-56e604ca1038.png", "BAS":"1BSdBWIjHGF4xk/2df5f6db-8621-4124-b43a-1f89a11c9efe.png", "ASV":"1BSdBWIjCjnOS3/879bd488-f34f-4167-854b-f7dbb9d88a19.png", "TEL":"1BSdBWIjCjnOS3/8f12d7f6-5b5c-45b9-9694-4243f48303f5.png", "OLY":"1BSdBWIjCjnONx/69bfccf7-7a0c-45eb-ab71-499acd9486bf.png", "PAN":"1BSdBWIjCjnONz/72ec6b88-a897-4ec7-bef1-e86bd23791ff.png", "PRS":"1BSdBWIjCjnONz/63c76ed0-6215-408b-b043-281666208665.png", "PAR":"1BSdBWIjCjnONz/195b7cae-7974-4840-a210-8b0a1f72d7d0.png", "MAD":"1BSdBWIjCjnONx/943efd9c-aa32-4de2-8829-fe888a45aebd.png", "PAM":"1BSdBWIjCjnONy/df9d8a88-d0d0-421f-af21-199640474bbb.png", "VIR":"1BSdBWIjHGF4pa/0d6de96d-8b8f-49e1-8817-f63409f86f2e.png", "ZAL":"1BSdBWIjCjnONz/3f0962de-443c-4860-996f-74b56d56e0ac.png"}
          for c, u in U.items():
              req = urllib.request.Request(B + u, headers={"User-Agent": "Mozilla/5.0"})
              im = Image.open(io.BytesIO(urllib.request.urlopen(req, timeout=30).read())).convert("RGBA")
              a = im.getchannel("A"); w, h = im.size
              bb = a.getbbox() or (0, 0, w, h); top = bb[1]
              row = [x for x in range(w) if a.getpixel((x, min(h - 1, top + int(0.1 * h)))) > 20]
              cx = (row[0] + row[-1]) // 2 if row else w // 2
              s = int(0.56 * w); x0 = max(0, min(w - s, cx - s // 2)); y0 = max(0, top - int(0.03 * h))
              im = im.crop((x0, y0, x0 + s, y0 + s)).resize((96, 96), Image.LANCZOS)
              bg = Image.new("RGBA", (96, 96), (232, 239, 248, 255)); bg.alpha_composite(im)
              bg.convert("RGB").save(f"photos/K-{c}.webp", "WEBP", quality=85)
              print(c, "ok")
          PY
      - name: Enregistrer
        run: |
          git config user.name "EuroLeague France"
          git config user.email "actions@users.noreply.github.com"
          git add photos/K-*.webp
          git diff --cached --quiet || git commit -m "Photos des coachs (K-<club>.webp)"
          git push
