name: Robot notes EuroLeague
# Note automatiquement les matchs terminés, publie data.json (Cloudflare Pages redéploie le site),
# et c'est tout (12/11/2026 : plus de post X, de notification ni de story).
on:
  schedule:
    # mardi-vendredi seulement (seuls soirs de matchs EuroLeague 2026-27), toutes les 10 min de 18h à 1h heure de Paris (hiver) ;
    # en plus, robot/run.py s'arrête aussitôt si aucun match n'est au calendrier ce soir-là.
    - cron: "*/10 17-23 * * 2-5"
    - cron: "*/10 0 * * 3-6"
  workflow_dispatch:
    inputs:
      check:
        description: "Contrôle seul : gamecodes déjà publiés à recalculer (ex. 91,92) — n'écrit rien"
        required: false
      codes:
        description: "Forcer ces gamecodes (ex. 101,102)"
        required: false
      share:
        description: "Refaire le post X de matchs déjà publiés (ex. 99) et renvoyer la notification"
        required: false
      story:
        description: "Publier (ou republier) la story Instagram de matchs déjà publiés (ex. 99)"
        required: false
permissions:
  contents: write
concurrency:
  group: robot-notes
  cancel-in-progress: false
jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 215
    steps:
      - uses: actions/checkout@v4
      - name: Contrôle (sans publication)
        if: ${{ github.event.inputs.check }}
        run: python3 robot/run.py --check "${{ github.event.inputs.check }}"
      - name: Noter et publier sur le site (veille toutes les 2 min tant qu'un match est en cours)
        if: ${{ !github.event.inputs.check }}
        env:
          CODES: ${{ github.event.inputs.codes }}
          SHARE: ${{ github.event.inputs.share }}
          STORY: ${{ github.event.inputs.story }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name "Robot EuroLeague France"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pw_ready=0; start=$(date +%s); final=0
          # GitHub ne déclenche le cron qu'environ toutes les 50 min : le passage reste donc actif et revérifie
          # toutes les 2 min tant qu'un match du soir est en cours (3 h 20 max), pour publier quelques minutes après la fin.
          while :; do
            published=0
            for attempt in 1 2 3; do
              git fetch -q origin main && git reset -q --hard origin/main
              rm -f robot/commit_msg.txt robot/share_queue.json robot/pending.txt
              set +e
              if [ -n "$SHARE$STORY" ]; then python3 robot/share.py rebuild "${SHARE:-$STORY}" && echo "Visuels refaits : ${SHARE:-$STORY}" > robot/commit_msg.txt
              elif [ -n "$CODES" ]; then python3 robot/run.py --codes "$CODES"
              else python3 robot/run.py; fi
              rc=$?
              set -e
              [ $rc -ne 0 ] && final=$rc
              [ -f robot/commit_msg.txt ] || break
              if [ -f robot/share_queue.json ]; then
                if [ $pw_ready = 0 ]; then pip install -q playwright && python3 -m playwright install --with-deps chromium >/dev/null && pw_ready=1; fi
                python3 robot/share.py render || echo "::warning::visuels X non fabriqués"
              fi
              python3 -c "import json;json.load(open('data.json'))"
              git add data.json og/m m 2>/dev/null || git add data.json
              if git diff --cached --quiet; then echo "Rien de nouveau à publier."; break; fi
              git commit -q -m "$(cat robot/commit_msg.txt)"
              if git push -q origin HEAD:main; then echo "Publié."; published=1; break; fi
              echo "Conflit de publication, nouvel essai ($attempt)"; sleep 10
            done
            [ -n "$CODES$SHARE$STORY" ] && break
            p=$(cat robot/pending.txt 2>/dev/null || echo 0)
            [ "$p" -gt 0 ] 2>/dev/null || break
            [ $(( $(date +%s) - start )) -lt 12000 ] || { echo "Fin de veille (3 h 20)."; break; }
            echo "$p match(s) en cours : nouveau passage dans 2 min."; sleep 120
          done
          echo "RC=$final" >> "$GITHUB_ENV"
          exit $final
      - name: Signaler un match bloqué par les contrôles
        if: ${{ env.RC != '' && env.RC != '0' }}
        run: exit 1
